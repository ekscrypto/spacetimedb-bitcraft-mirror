[package]
name = "relay-cache"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ekscrypto/spacetimedb-bitcraft-mirror"
description = "BitCraft read cache: standalone WebSocket-mode binary + embedded in-process mode for spacetimedb-bitcraft-mirror"

[lib]
name = "relay_cache"
path = "src/lib.rs"

[[bin]]
name = "relay-cache"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
futures-util = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
url = { workspace = true }
rustls = { workspace = true }

axum = { workspace = true, features = ["ws", "macros"] }
tower-http = { workspace = true, features = ["trace"] }

serde = { workspace = true }
serde_json = { workspace = true }
prost = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

anyhow = { workspace = true }

clap = { workspace = true, features = ["env"] }
parking_lot = { workspace = true }
dashmap = { workspace = true }
sysinfo = { workspace = true }
hashbrown = { workspace = true, features = ["default-hasher"] }
hex = { workspace = true }
reqwest = { workspace = true }
sha2 = "0.10"

# SpacetimeDB in-repo crates (this workspace's v2.7.1) — the mirror this crate
# talks to (or embeds into) speaks exactly these wire formats. The
# public-mirror client provides the observer seam + decoded upstream types
# consumed by the embedded feed (src/feed.rs).
spacetimedb-sats = { workspace = true }
spacetimedb-client-api-messages = { workspace = true }
spacetimedb-public-mirror-client = { workspace = true }

relay-protocol = { workspace = true }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"
tower = "0.5"
