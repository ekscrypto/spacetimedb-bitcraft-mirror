syntax = "proto3";
package roads_cache;

// Relay-side roads terrain cache API for relay.bitcraftsync.app.
//
// Binary responses: Accept: application/x-protobuf
// Schemas listed on GET /proto alongside relay_cache.proto.

// ---------------------------------------------------------------------------
// Fleet / region status
// ---------------------------------------------------------------------------

// GET /roads/health
message RoadsCacheHealth {
  bool ready = 1;
  uint32 regions_ready = 2;
  uint32 regions_total = 3;
  uint64 total_memory_bytes = 4;
  repeated RegionRoadStatus regions = 5;
}

// Per-region row inside RoadsCacheHealth (also useful for diagnostics).
message RegionRoadStatus {
  uint32 region = 1;
  // 0=unspecified 1=idle 2=loading 3=ready 4=error
  uint32 state = 2;
  bool connected = 3;
  int64 loaded_at_unix_ms = 4;
  int64 last_update_unix_ms = 5;
  string error = 6;
  uint64 memory_bytes = 7;
  uint32 claim_count = 8;
  uint32 paved_tile_count = 9;
  uint32 claim_tile_count = 10;
}

enum RegionState {
  REGION_STATE_UNSPECIFIED = 0;
  REGION_STATE_IDLE = 1;
  REGION_STATE_LOADING = 2;
  REGION_STATE_READY = 3;
  REGION_STATE_ERROR = 4;
}

// ---------------------------------------------------------------------------
// Atomic full-region map snapshot
// GET /roads/region/{id}/map
// ---------------------------------------------------------------------------

// Single HTTP response carrying terrain, overlay, and claim index table
// from the same read-lock snapshot — claim_index facets in overlay always
// resolve against claim_table in this message.
//
// Overlay cell layout (u32 LE, row-major lz * REGION_SIDE + lx):
//   bits  0-15: paving_type_id (0 = none)
//   bits 16-31: claim_index (0 = none; index into claim_table)
//
// claim_entity_id = claim_index == 0 ? 0 : claim_table[claim_index]
message RegionMapSnapshot {
  uint32 region = 1;
  uint64 generation = 2;
  int64 last_update_unix_ms = 3;
  int32 origin_x = 4;
  int32 origin_z = 5;

  // claim_table[0] = 0 sentinel; claim_table[i] = entity_id for i >= 1
  repeated uint64 claim_table = 6 [packed = true];
  repeated uint64 neutral_claim_ids = 7 [packed = true];

  // SuperHexTerrainGrid: 2560×2560 u64 LE (~52.4 MiB)
  bytes terrain = 8;
  // TileOverlayGrid: 7680×7680 u32 LE (~225.9 MiB)
  bytes overlay = 9;

  // SHA-256 hex of terrain||overlay||claim_table bytes for ETag / If-None-Match
  string etag = 10;
}

// ---------------------------------------------------------------------------
// Point lookup of resource nodes on a hex list
// POST /roads/region/{id}/resources
//
// Backed by the dense per-region resource tile map (roads/resource_map.rs),
// which carries ALL resource_state rows (every resource type, including
// forageables and event resources) — filtering to harvestable tags is the
// client's job now. Multi-hex resources (clay, sand, large trees, ore
// veins, giant bushes, …) are stamped on every occupied tile:
// resource_desc.footprint axial offsets, rotated by
// resource_state.direction_index, onto the odd-r world lattice.
//
// direction + origin let clients reconstruct full resource instances from
// per-tile rows: origin tiles anchor an instance, direction (0..=5) gives
// the rotated shape. The world does overlap single-hex forageables with
// multi-hex resources; the tile map keeps one resource per tile — the
// multi-hex shape wins, and a single-hex newcomer onto an occupied tile is
// not stamped (the long-standing occupant stays visible).
// ---------------------------------------------------------------------------

message Hex {
  int32 x = 1;
  int32 z = 2;
}

message ResourceQuery {
  repeated Hex tiles = 1;
}

message ResourceNode {
  int32 x = 1;
  int32 z = 2;
  int32 resource_id = 3;
  // resource_state.direction_index of the owning resource (0..=5).
  uint32 direction = 4;
  // True when this tile is the resource's anchor (origin) tile.
  bool origin = 5;
}

message ResourcesResponse {
  repeated ResourceNode nodes = 1;
}

// ---------------------------------------------------------------------------
// Sparse map window over a world hex list
// POST /roads/region/{id}/map
//
// Same payload as GET /roads/region/{id}/map, limited to the requested
// tiles (world odd-r coords). Out-of-region tiles are silently skipped.
// ---------------------------------------------------------------------------

message MapQuery {
  repeated Hex tiles = 1;
}

message MapTile {
  int32 x = 1;                // world odd-r, echoed from the query
  int32 z = 2;
  uint32 paving_type_id = 3;  // 0 = none
  uint64 claim_entity_id = 4; // 0 = unclaimed
}

// Super hex = the game's terrain cell: a true hex at 3x the tile scale in
// odd-r offset coordinates. x/z is the world coord of its CENTER tile
// (3X + (Z&1), 3Z) — odd super rows sit one tile right. The super
// exclusively owns the 7-tile flower around that center; corner tiles
// where three supers meet blend all three.
message MapSuperHex {
  int32 x = 1;
  int32 z = 2;
  // Same layout as RegionMapSnapshot terrain cells (pack_terrain):
  // elev u16 | original u16<<16 | water u16<<32 | water_body_type u8<<48
  uint64 terrain = 3;
}

message RegionMapWindow {
  uint32 region = 1;
  uint64 generation = 2;
  int64 last_update_unix_ms = 3;
  int32 origin_x = 4;
  int32 origin_z = 5;
  repeated MapSuperHex terrain = 6; // deduped, sorted by (x, z)
  repeated MapTile tiles = 7;       // sorted by (x, z)
}
