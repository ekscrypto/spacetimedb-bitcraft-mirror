[package]
name = "relay-test-harness"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ekscrypto/spacetimedb-bitcraft-mirror"
description = "Post-deploy v1/v2 BSATN + schema integrity gate for relay.bitcraftsync.app"

[[bin]]
name = "relay-test-harness"
path = "src/main.rs"

[dependencies]
spacetimedb-sats = { workspace = true }
spacetimedb-client-api-messages = { workspace = true }
spacetimedb-lib = { workspace = true }
spacetimedb-client-api-messages-v1 = { workspace = true }
spacetimedb-lib-v1 = { workspace = true }
relay-protocol = { workspace = true }

tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }

clap = { workspace = true, features = ["env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
